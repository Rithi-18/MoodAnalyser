<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindPath | Mental Health Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-screen" class="auth-container fade-in">
        <div class="auth-card">
            <div class="logo justify-center">
                <i data-lucide="brain" class="logo-icon"></i>
                <h2>MindPath</h2>
            </div>
            <p class="auth-subtitle">Welcome back. Please log in to continue.</p>
            
            <div class="auth-tabs">
                <button id="tab-login" class="active" onclick="switchAuthMode(true)">Log In</button>
                <button id="tab-register" onclick="switchAuthMode(false)">Sign Up</button>
            </div>

            <input type="text" id="username" class="auth-input" placeholder="Username">
            <input type="password" id="password" class="auth-input" placeholder="Password">
            <p id="auth-error" class="error-text hidden"></p>
            
            <button class="btn-primary full-width" onclick="handleAuth()" id="auth-btn">Log In</button>
        </div>
    </div>

    <div id="app-screen" class="app-container hidden fade-in">
        <aside class="sidebar">
            <div class="logo">
                <i data-lucide="brain" class="logo-icon"></i>
                <h2>MindPath</h2>
            </div>
            <nav>
                <button class="nav-btn active" onclick="switchTab('dashboard')"><i data-lucide="layout-dashboard"></i> Dashboard</button>
                <button class="nav-btn" onclick="switchTab('journal')"><i data-lucide="pen-line"></i> Journal</button>
                <button class="nav-btn" onclick="switchTab('analytics')"><i data-lucide="trending-up"></i> Analytics</button>
                <button class="nav-btn logout" onclick="logout()"><i data-lucide="log-out"></i> Sign Out</button>
            </nav>
        </aside>

        <main class="content-area">
            <section id="dashboard" class="tab-content active fade-in">
                <header class="page-header">
                    <h1>Welcome Back</h1>
                </header>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon purple"><i data-lucide="activity"></i></div>
                        <div class="stat-info">
                            <h3>Current Mood</h3>
                            <p id="dash-current-mood">Loading...</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon blue"><i data-lucide="calendar-days"></i></div>
                        <div class="stat-info">
                            <h3>Entries</h3>
                            <p id="dash-entry-count">0</p>
                        </div>
                    </div>
                </div>
                <div class="recent-activity card">
                    <h3>Recent Reflections</h3>
                    <div id="recent-logs-container" class="log-list"></div>
                </div>
            </section>

            <section id="journal" class="tab-content hidden fade-in">
                <header class="page-header">
                    <h1>Express Yourself</h1>
                </header>
                <div class="card journal-box">
                    <textarea id="journal-input" placeholder="How are you feeling right now? Type your thoughts here..."></textarea>
                    <button class="btn-primary" onclick="submitJournal()"><i data-lucide="sparkles"></i> Analyze & Save</button>
                </div>
                <div id="analysis-result" class="card result-card hidden slide-up">
                    <h3 id="result-sentiment">Analysis Complete</h3>
                    <p id="result-suggestion"></p>
                </div>
            </section>

            <section id="analytics" class="tab-content hidden fade-in">
                <header class="page-header"><h1>Mood Trends</h1></header>
                <div class="card chart-container"><canvas id="moodChart"></canvas></div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
